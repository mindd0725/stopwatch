<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@300..500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 배경·글자색이 부드럽게 바뀌도록 색상 변수로 등록 */
  @property --bg  { syntax: "<color>"; inherits: true; initial-value: #f4f4f1; }
  @property --ink { syntax: "<color>"; inherits: true; initial-value: #0b0b0b; }

  :root {
    --bg: #f4f4f1;
    --ink: #0b0b0b;
    --muted: color-mix(in srgb, var(--ink) 52%, var(--bg));
    --rule: color-mix(in srgb, var(--ink) 14%, transparent);
    --accent: #ff5a1f;
    --pulse: 0;
    --sans: "Geist", "Pretendard Variable", Pretendard, system-ui, sans-serif;
    --serif: "Instrument Serif", "Pretendard Variable", Pretendard, serif;
    --mono: "Geist Mono", "Pretendard Variable", Pretendard, ui-monospace, monospace;
    transition: --bg .8s cubic-bezier(.4, 0, .2, 1), --ink .8s cubic-bezier(.4, 0, .2, 1);
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); overflow-x: hidden; }
  body {
    margin: 0;
    overflow-x: hidden;
    min-height: 100vh;
    background: radial-gradient(ellipse 110% 70% at 50% 18%, color-mix(in srgb, var(--bg) 88%, #fff), var(--bg) 70%);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 40px 16px 56px;
  }
  /* 아주 옅은 필름 그레인 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .16;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
  }
  .wrap { width: 100%; max-width: 480px; position: relative; z-index: 1; }

  .masthead {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }
  .masthead h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(34px, 10vw, 44px);
    line-height: .9;
    letter-spacing: -.5px;
    white-space: nowrap;
  }
  .masthead h1 em { font-style: italic; }
  .masthead .meta {
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.6;
    white-space: nowrap;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    text-align: right;
    color: var(--muted);
  }

  /* 비트에 맞춰 숨쉬는 주변광 */
  .stage { position: relative; isolation: isolate; }
  .stage::before {
    content: "";
    position: absolute;
    inset: -10% -16%;
    z-index: -1;
    background: radial-gradient(closest-side, rgba(255, 90, 31, .35), transparent);
    opacity: calc(.08 + .45 * var(--pulse));
    filter: blur(10px);
    pointer-events: none;
  }

  /* ───────── 턴테이블 ───────── */
  .deck-box { container-type: inline-size; }
  .deck {
    position: relative;
    width: 100%;
    aspect-ratio: 100 / 88;
    border-radius: 22px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 30% 0%, rgba(255,255,255,.07), transparent 60%),
      #121212;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.08),
      inset 0 1px 0 rgba(255,255,255,.12),
      0 30px 60px -20px rgba(0,0,0,.55),
      0 2px 6px rgba(0,0,0,.2);
  }

  .platter {
    position: absolute;
    left: 5cqw; top: 5cqw;
    width: 72cqw; height: 72cqw;
    border-radius: 50%;
    background:
      radial-gradient(circle, transparent 0 95.6%, rgba(0,0,0,.4) 96.2%, transparent 97%),
      repeating-conic-gradient(#d4d4d0 0 1.5deg, #6c6c69 1.5deg 3deg);
    box-shadow: 0 1.6cqw 3.4cqw rgba(0,0,0,.7), 0 0 0 .25cqw #050505;
    will-change: transform;
  }
  .record {
    position: absolute;
    inset: 1.8cqw;
    border-radius: 50%;
    background:
      radial-gradient(circle,
        transparent 0 37%, rgba(255,255,255,.05) 37.6%, transparent 38.6%,
        transparent 52%, rgba(255,255,255,.05) 52.5%, transparent 53.5%,
        transparent 67%, rgba(255,255,255,.05) 67.5%, transparent 68.5%,
        transparent 82%, rgba(255,255,255,.05) 82.5%, transparent 83.5%,
        transparent 96.5%, #050505 97%),
      repeating-radial-gradient(circle, #0f0f0f 0 .26cqw, #1b1b1b .34cqw, #0f0f0f .46cqw);
  }
  .label {
    position: absolute;
    left: 50%; top: 50%;
    width: 24cqw; height: 24cqw;
    transform: translate(-50%, -50%);
  }
  .label svg { width: 100%; height: 100%; display: block; }
  .spindle {
    position: absolute;
    left: 50%; top: 50%;
    width: 1.5cqw; height: 1.5cqw;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #a8a8a8 55%, #3a3a3a);
  }
  .sheen {
    position: absolute;
    left: 6.8cqw; top: 6.8cqw;
    width: 68.4cqw; height: 68.4cqw;
    border-radius: 50%;
    pointer-events: none;
    background:
      conic-gradient(from 18deg,
        transparent 0deg, rgba(255,255,255,.15) 20deg, rgba(200,215,255,.05) 32deg, transparent 50deg,
        transparent 185deg, rgba(255,255,255,.1) 204deg, rgba(255,215,200,.04) 216deg, transparent 232deg);
    -webkit-mask: radial-gradient(circle, transparent 0 35.2%, #000 36%);
            mask: radial-gradient(circle, transparent 0 35.2%, #000 36%);
  }
  .strobe-light {
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    background: radial-gradient(circle at 72cqw 74cqw, rgba(255, 90, 31, .5), transparent 18cqw);
    opacity: 0;
  }
  .strobe-lamp {
    position: absolute;
    left: 71cqw; top: 73cqw;
    width: 2cqw; height: 2cqw;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 .5cqw #1e1e1e, 0 0 0 .6cqw rgba(255,255,255,.12);
    opacity: .35;
  }

  .ripple {
    position: absolute;
    left: 41cqw; top: 41cqw;
    width: 24cqw; height: 24cqw;
    margin: -12cqw 0 0 -12cqw;
    border-radius: 50%;
    border: .3cqw solid rgba(255, 255, 255, .7);
    pointer-events: none;
    animation: ripple 1.4s cubic-bezier(.2, .6, .3, 1) forwards;
  }
  .ripple.soft { border-color: rgba(255, 90, 31, .7); border-width: .22cqw; animation-duration: 1s; }
  @keyframes ripple {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(2.9); opacity: 0; }
  }

  /* 톤암 */
  .arm-base {
    position: absolute;
    left: 81cqw; top: 6cqw;
    width: 12cqw; height: 12cqw;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #2c2c2c, #0c0c0c 70%);
    box-shadow: inset 0 0 0 .35cqw #8f8f8b, 0 .9cqw 1.8cqw rgba(0,0,0,.6);
  }
  .arm-rest {
    position: absolute;
    left: 91.4cqw; top: 51cqw;
    width: 2.4cqw; height: 4.4cqw;
    border-radius: 1.2cqw;
    background: #2a2a2a;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
  }
  .arm {
    position: absolute;
    left: 87cqw; top: 12cqw;
    width: 0; height: 0;
    transform: rotate(3deg); /* 거치대 위치 */
    transition: transform 1.1s cubic-bezier(.45, .05, .25, 1);
    filter: drop-shadow(1.1cqw 1.6cqw .9cqw rgba(0,0,0,.5));
  }
  .arm.playing { transform: rotate(23deg); }
  /* 재생 중 안쪽으로 천천히 이동하는 각도 (매 프레임 갱신하므로 재생 중엔 전환 효과 없음) */
  .arm-inner { position: absolute; left: 0; top: 0; transition: transform 1.1s cubic-bezier(.45, .05, .25, 1); }
  .arm.playing .arm-inner { transition: none; }
  .arm .weight {
    position: absolute;
    left: -2.9cqw; top: -10.5cqw;
    width: 5.8cqw; height: 7cqw;
    border-radius: 1.4cqw;
    background: linear-gradient(90deg, #0a0a0a, #2e2e2e 45%, #0a0a0a);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .arm .rod {
    position: absolute;
    left: -.6cqw; top: -4cqw;
    width: 1.2cqw; height: 52cqw;
    border-radius: .6cqw;
    background: linear-gradient(90deg, #8a8a86, #f7f7f4 42%, #9a9a96 70%, #6a6a66);
  }
  .arm .pivot {
    position: absolute;
    left: -2.1cqw; top: -2.1cqw;
    width: 4.2cqw; height: 4.2cqw;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fafafa, #9a9a96 70%);
  }
  .arm .head {
    position: absolute;
    left: -2.3cqw; top: 46cqw;
    width: 4.6cqw; height: 8.4cqw;
    border-radius: .8cqw .8cqw 1.4cqw 1.4cqw;
    background: #0a0a0a;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
  }
  .arm .lift {
    position: absolute;
    left: 2cqw; top: 48cqw;
    width: 3cqw; height: .8cqw;
    border-radius: .4cqw;
    background: var(--accent);
  }

  /* 본체 버튼 */
  .key {
    position: absolute;
    bottom: 3.6cqw;
    height: 6.2cqw;
    padding: 0;
    border-radius: 99px;
    font: 500 max(9px, 1.8cqw)/1 var(--mono);
    letter-spacing: .12cqw;
    white-space: nowrap;
    cursor: pointer;
    transition: transform .1s, background .2s, color .2s, opacity .2s;
  }
  .key:active:not(:disabled) { transform: scale(.96); }
  .key:disabled { opacity: .35; cursor: default; }
  .key:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .key.start {
    left: 4.4cqw; width: 18cqw;
    border: none;
    color: #0b0b0b;
    background: #f4f4f1;
  }
  .key.start.running { background: var(--accent); color: #0b0b0b; }
  .key.lap {
    left: 24cqw; width: 11cqw;
    border: 1px solid rgba(255,255,255,.28);
    color: #f4f4f1;
    background: transparent;
  }
  .key.lap:hover:not(:disabled) { background: rgba(255,255,255,.08); }
  .power {
    position: absolute;
    left: 4.8cqw; bottom: 12.2cqw;
    display: flex;
    align-items: center;
    gap: 1.2cqw;
    font: 400 max(8px, 1.4cqw)/1 var(--mono);
    letter-spacing: .3cqw;
    color: rgba(255,255,255,.4);
  }
  .power i {
    width: 1.4cqw; height: 1.4cqw;
    border-radius: 50%;
    background: #333;
    transition: background .25s, box-shadow .25s;
  }
  .power.on i { background: var(--accent); box-shadow: 0 0 1.6cqw var(--accent); }
  .plate {
    position: absolute;
    right: 4.6cqw; bottom: 3.6cqw;
    text-align: right;
    line-height: 1.15;
  }
  .plate .name { font-family: var(--serif); font-style: italic; font-size: 4cqw; color: #f4f4f1; }
  .plate .model { font: 400 max(7px, 1.25cqw) var(--mono); letter-spacing: .25cqw; color: rgba(255,255,255,.4); }

  /* ───────── 디스플레이 ───────── */
  .receiver-box { container-type: inline-size; margin-top: 14px; }
  .receiver {
    padding: 4.4cqw 5cqw 4.2cqw;
    border-radius: 22px;
    background:
      radial-gradient(ellipse 80% 70% at 50% 0%, rgba(255,255,255,.06), transparent 60%),
      #121212;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.08),
      inset 0 1px 0 rgba(255,255,255,.12),
      0 30px 60px -24px rgba(0,0,0,.5);
    color: #f4f4f1;
  }
  .row-top, .console {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font: 400 max(9px, 1.9cqw)/1 var(--mono);
    letter-spacing: .3cqw;
    text-transform: uppercase;
    color: rgba(255,255,255,.45);
  }
  .time {
    display: flex;
    justify-content: center;
    margin: 3.2cqw 0 2.4cqw;
    font-family: var(--mono);
    font-weight: 300;
    font-size: 15.5cqw;
    line-height: 1;
    letter-spacing: -.4cqw;
    font-variant-numeric: tabular-nums;
    color: #f7f7f4;
    text-shadow: 0 0 calc(2.4cqw * var(--pulse)) rgba(255, 255, 255, calc(.55 * var(--pulse)));
  }
  .time span {
    display: inline-block;
    width: .62em;
    text-align: center;
    overflow: hidden;
  }
  .time span.sep {
    width: .38em;
    color: var(--accent);
    opacity: calc(.45 + .55 * var(--pulse));
  }
  .time span.small { font-size: .62em; align-self: flex-end; margin-bottom: .08em; width: .62em; }
  .time span.roll { animation: roll .28s cubic-bezier(.2, .8, .2, 1); }
  @keyframes roll {
    from { transform: translateY(-45%); opacity: 0; filter: blur(2px); }
    to { transform: none; opacity: 1; filter: none; }
  }
  /* 한 마디(4박) 진행선 */
  .bar {
    position: relative;
    height: 2px;
    border-radius: 2px;
    background: rgba(255,255,255,.1);
    overflow: hidden;
    margin-bottom: 3.4cqw;
  }
  .bar i {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    background: var(--accent);
  }
  .bar::after { /* 박자 눈금 */
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 2px), #121212 calc(25% - 2px) 25%);
  }
  .lamps { display: flex; gap: 1.6cqw; }
  .lamp {
    width: 2.2cqw; height: 2.2cqw;
    border-radius: 50%;
    background: #2b2b2b;
    transition: background .08s;
  }
  .lamp.on { background: #f4f4f1; box-shadow: 0 0 calc(1.8cqw * var(--pulse)) rgba(255,255,255,.7); }
  .lamp.on.down { background: var(--accent); box-shadow: 0 0 calc(2.2cqw * var(--pulse)) var(--accent); }
  .status { color: #f4f4f1; }
  .sound {
    padding: 1.3cqw 2.4cqw;
    border-radius: 99px;
    border: 1px solid rgba(255,255,255,.25);
    background: transparent;
    color: rgba(255,255,255,.7);
    font: inherit;
    letter-spacing: inherit;
    cursor: pointer;
    transition: background .2s, color .2s, border-color .2s;
  }
  .sound:hover { background: rgba(255,255,255,.08); }
  .sound.on { background: #f4f4f1; color: #0b0b0b; border-color: #f4f4f1; }
  .sound:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ───────── 트랙리스트 ───────── */
  .sleeve { margin-top: 36px; }
  .sleeve-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--ink);
  }
  .sleeve-head h2 { margin: 0; font-family: var(--serif); font-size: 32px; font-weight: 400; font-style: italic; line-height: 1; }
  .sleeve-head span { font: 400 10.5px var(--mono); letter-spacing: 1.4px; color: var(--muted); text-transform: uppercase; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 15px;
  }
  li .no { width: 26px; font: 400 12px var(--mono); color: var(--muted); }
  li .name { flex: 1; font-weight: 500; letter-spacing: -.2px; }
  li .tag {
    font-size: 11px;
    font-weight: 500;
    padding: 4px 9px;
    border-radius: 99px;
    border: 1px solid var(--rule);
    color: var(--muted);
  }
  li .time-cell { font: 400 15px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.2px; }
  li.current .tag { border-color: var(--accent); color: var(--accent); }
  li.best .tag { background: var(--accent); border-color: var(--accent); color: #0b0b0b; }
  li.worst .tag { border-color: var(--ink); color: var(--ink); }
  .empty { padding: 18px 0; color: var(--muted); font-size: 14px; }

  .hint {
    margin-top: 22px;
    text-align: center;
    font: 400 10.5px var(--mono);
    letter-spacing: 1px;
    color: var(--muted);
  }
  .hint kbd {
    font: inherit;
    padding: 2px 6px;
    border-radius: 5px;
    border: 1px solid var(--rule);
  }

  @media (prefers-reduced-motion: reduce) {
    .ripple { display: none; }
    .time span.roll { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>The <em>Stopwatch</em></h1>
    <div class="meta">Side A<br>33⅓ RPM · 120 BPM</div>
  </header>

  <div class="stage">
    <div class="deck-box">
      <div class="deck" id="deck">
        <div class="platter" id="platter">
          <div class="record">
            <div class="label">
              <svg viewBox="0 0 100 100" aria-hidden="true">
                <defs>
                  <path id="ring" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/>
                </defs>
                <circle cx="50" cy="50" r="50" fill="#ff5a1f"/>
                <circle cx="50" cy="50" r="30" fill="none" stroke="#0b0b0b" stroke-width=".5" opacity=".5"/>
                <text font-family="Geist Mono, monospace" font-size="5.4" fill="#0b0b0b" letter-spacing=".4">
                  <textPath href="#ring" textLength="236" lengthAdjust="spacing">STOPWATCH — SIDE A — 33⅓ RPM — 120 BPM — </textPath>
                </text>
                <text x="50" y="45" text-anchor="middle" font-family="Instrument Serif, serif" font-style="italic" font-size="14" fill="#0b0b0b">Stopwatch</text>
                <text x="50" y="63" text-anchor="middle" font-family="Geist Mono, monospace" font-size="4.4" letter-spacing="1" fill="#0b0b0b">SW—1200</text>
              </svg>
              <div class="spindle"></div>
            </div>
          </div>
        </div>
        <div class="sheen"></div>
        <div class="strobe-light" id="strobeLight"></div>
        <div class="strobe-lamp" id="strobeLamp"></div>
        <div class="arm-rest"></div>
        <div class="arm-base"></div>
        <div class="arm" id="arm">
          <div class="arm-inner" id="armInner">
            <div class="weight"></div>
            <div class="rod"></div>
            <div class="head"></div>
            <div class="lift"></div>
            <div class="pivot"></div>
          </div>
        </div>
        <div class="power" id="power"><i></i>POWER</div>
        <button class="key start" id="startBtn">START</button>
        <button class="key lap" id="lapBtn" disabled>LAP</button>
        <div class="plate">
          <div class="name">Stopwatch</div>
          <div class="model">SW-1200 TURNTABLE</div>
        </div>
      </div>
    </div>

    <div class="receiver-box">
      <div class="receiver">
        <div class="row-top"><span>Elapsed</span><span id="track">Track A1</span></div>
        <div class="time" id="time"></div>
        <div class="bar"><i id="barFill"></i></div>
        <div class="console">
          <div class="lamps" id="lamps">
            <div class="lamp"></div><div class="lamp"></div><div class="lamp"></div><div class="lamp"></div>
          </div>
          <div class="status" id="status">Stop</div>
          <button class="sound" id="soundBtn" aria-pressed="false">Sound Off</button>
        </div>
      </div>
    </div>
  </div>

  <section class="sleeve">
    <div class="sleeve-head"><h2>Side A</h2><span>Lap tracklist</span></div>
    <ul id="laps"></ul>
  </section>

  <p class="hint"><kbd>Space</kbd> 시작/정지 &nbsp; <kbd>L</kbd> 랩 &nbsp; <kbd>R</kbd> 재설정 &nbsp; <kbd>S</kbd> 사운드</p>
</div>

<script>
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const platter = $('platter'), arm = $('arm'), armInner = $('armInner');
  const power = $('power'), strobeLight = $('strobeLight'), strobeLamp = $('strobeLamp');
  const timeEl = $('time'), barFill = $('barFill'), statusEl = $('status'), trackEl = $('track');
  const startBtn = $('startBtn'), lapBtn = $('lapBtn'), soundBtn = $('soundBtn');
  const lapList = $('laps'), deck = $('deck');
  const lamps = [...$('lamps').children];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const DEG_PER_MS = 360 * (100 / 3) / 60000; // 33⅓ RPM
  const BEAT_MS = 500;                         // 120 BPM, 4/4
  const ARM_SWEEP = 14;                        // 바깥 소리골(23°)에서 안쪽 끝까지 이동하는 각도
  const SIDE_LENGTH = 25 * 60000;              // LP 한 면(25분)에 걸쳐 안쪽으로 이동

  let running = false;
  let startTime = 0;
  let elapsed = 0;
  let lapStart = 0;
  let laps = [];

  // 애니메이션 상태
  let rot = 0, spin = 0;       // 플래터 각도와 현재 회전 속도(관성)
  let pulse = 0;               // 비트 강조 0..1
  let lastBeat = -1, lastMinute = 0;

  function now() {
    return running ? elapsed + (performance.now() - startTime) : elapsed;
  }

  function format(ms) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    const pad = n => String(n).padStart(2, '0');
    return (h ? h + ':' : '') + pad(m) + ':' + pad(s) + '.' + pad(cs);
  }

  /* ── 배경: 버튼을 누를 때마다 흑백 톤을 한 칸씩 오가며 변경 ── */
  const TONES = ['#f4f4f1', '#e2e2de', '#c4c4bf', '#8d8d89', '#2a2a29', '#151515', '#050505'];
  let toneIndex = matchMedia('(prefers-color-scheme: dark)').matches ? TONES.length - 1 : 0;
  let toneDir = toneIndex === 0 ? 1 : -1;
  function applyTone() {
    const hex = TONES[toneIndex];
    const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
    const light = (0.299 * r + 0.587 * g + 0.114 * b) > 128;
    root.style.setProperty('--bg', hex);
    root.style.setProperty('--ink', light ? '#0b0b0b' : '#f2f2ef');
  }
  function nextBackground() {
    if (toneIndex + toneDir < 0 || toneIndex + toneDir >= TONES.length) toneDir *= -1;
    toneIndex += toneDir;
    applyTone();
  }
  applyTone();

  /* ── 시간 표시 (바뀐 자리만 굴러 내려오는 애니메이션) ── */
  let cells = [];
  let shown = '';
  function renderTime(str) {
    if (str.length !== cells.length) {
      timeEl.innerHTML = '';
      const dot = str.indexOf('.');
      cells = [...str].map((ch, i) => {
        const el = document.createElement('span');
        if (ch === ':' || ch === '.') el.className = 'sep';
        else if (i > dot) el.className = 'small';
        timeEl.appendChild(el);
        return { el, ch: '' };
      });
    }
    [...str].forEach((ch, i) => {
      const cell = cells[i];
      if (cell.ch === ch) return;
      cell.ch = ch;
      cell.el.textContent = ch;
      if (running && !reduceMotion && i < str.length - 3 && !cell.el.classList.contains('sep')) {
        cell.el.classList.remove('roll');
        void cell.el.offsetWidth;
        cell.el.classList.add('roll');
      }
    });
    shown = str;
  }

  const accentOf = k => k % 4 === 0 ? 1 : k % 4 === 2 ? .72 : .48;

  /* ── 사운드 (선택) ── */
  let soundOn = false, actx = null, master = null, crackleGain = null, noiseBuf = null;
  function ensureAudio() {
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = .6;
    master.connect(actx.destination);

    // 바이닐 크래클: 잔잔한 히스 + 드문드문 튀는 팝
    const len = actx.sampleRate * 4;
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    let pop = 0;
    for (let i = 0; i < len; i++) {
      if (Math.random() < .00028) pop = (Math.random() * .3 + .12) * (Math.random() < .5 ? -1 : 1);
      d[i] = (Math.random() * 2 - 1) * .01 + pop;
      pop *= .8;
    }
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 4800;
    crackleGain = actx.createGain();
    crackleGain.gain.value = 0;
    src.connect(lp).connect(crackleGain).connect(master);
    src.start();

    noiseBuf = actx.createBuffer(1, actx.sampleRate * .1, actx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  }
  function updateCrackle() {
    if (!actx) return;
    crackleGain.gain.setTargetAtTime(soundOn && running ? .55 : 0, actx.currentTime, .12);
  }
  function kick(a) {
    const t0 = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(115, t0);
    o.frequency.exponentialRampToValueAtTime(42, t0 + .18);
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(.5 * a, t0 + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + .34);
    o.connect(g).connect(master);
    o.start(t0);
    o.stop(t0 + .4);
  }
  function hat(a) {
    const t0 = actx.currentTime;
    const s = actx.createBufferSource(), hp = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf;
    hp.type = 'highpass';
    hp.frequency.value = 7000;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.exponentialRampToValueAtTime(.12 * a, t0 + .002);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + .05);
    s.connect(hp).connect(g).connect(master);
    s.start(t0);
    s.stop(t0 + .08);
  }

  /* ── 비트 이벤트 ── */
  function onBeat(k) {
    lamps.forEach((l, i) => {
      l.classList.toggle('on', i === k % 4);
      l.classList.toggle('down', i === 0);
    });
    if (soundOn && actx) {
      if (k % 2 === 0) kick(accentOf(k)); else hat(.7);
    }
  }

  function ripple(soft) {
    if (reduceMotion) return;
    const r = document.createElement('div');
    r.className = 'ripple' + (soft ? ' soft' : '');
    r.addEventListener('animationend', () => r.remove());
    deck.insertBefore(r, arm);
  }

  /* ── 메인 루프 ── */
  let lastFrame = performance.now();
  function frame(ts) {
    const dt = Math.min(ts - lastFrame, 64);
    lastFrame = ts;
    const t = now();

    // 플래터: 모터 관성으로 서서히 붙고, 정지 시 서서히 멈춤
    const target = running ? DEG_PER_MS : 0;
    spin += (target - spin) * (1 - Math.exp(-dt / (running ? 260 : 520)));
    if (spin < 1e-5 && !running) spin = 0;
    rot = (rot + spin * dt) % 360;
    platter.style.transform = `rotate(${rot}deg)`;

    // 톤암: 재생 시간에 따라 안쪽으로
    const sweep = running ? ARM_SWEEP * (t % SIDE_LENGTH) / SIDE_LENGTH : 0;
    armInner.style.transform = `rotate(${sweep}deg)`;

    // 시간 표시
    const str = format(t);
    if (str !== shown) renderTime(str);
    const current = lapList.querySelector('li.current .time-cell');
    if (current) current.textContent = format(t - lapStart);

    // 비트
    const k = Math.floor(t / BEAT_MS);
    const phase = t - k * BEAT_MS;
    if (running) {
      if (k !== lastBeat) { lastBeat = k; onBeat(k); }
      pulse = accentOf(k) * Math.exp(-phase / 170) * (reduceMotion ? .5 : 1);
      const m = Math.floor(t / 60000);
      if (m > lastMinute) { lastMinute = m; ripple(false); setTimeout(() => ripple(false), 220); }
    } else {
      pulse *= Math.exp(-dt / 220);
    }
    root.style.setProperty('--pulse', pulse.toFixed(3));
    barFill.style.width = (t > 0 ? ((t % (BEAT_MS * 4)) / (BEAT_MS * 4)) * 100 : 0).toFixed(2) + '%';
    strobeLight.style.opacity = (running ? .2 + .8 * pulse : pulse).toFixed(3);
    strobeLamp.style.opacity = (running ? .55 + .45 * pulse : .35).toFixed(3);

    requestAnimationFrame(frame);
  }

  /* ── 트랙리스트 ── */
  function renderLaps() {
    lapList.innerHTML = '';
    const t = now();
    if (!running && elapsed === 0) {
      lapList.innerHTML = '<li class="empty">START를 누르면 Side A가 재생됩니다.</li>';
      trackEl.textContent = 'Track A1';
      return;
    }
    lapList.appendChild(makeRow(laps.length + 1, t - lapStart, 'current', running ? '재생 중' : '일시정지'));
    let best = -1, worst = -1;
    if (laps.length >= 2) {
      best = laps.indexOf(Math.min(...laps));
      worst = laps.indexOf(Math.max(...laps));
    }
    for (let i = laps.length - 1; i >= 0; i--) {
      const cls = i === best ? 'best' : i === worst ? 'worst' : '';
      const tag = i === best ? '가장 빠름' : i === worst ? '가장 느림' : '';
      lapList.appendChild(makeRow(i + 1, laps[i], cls, tag));
    }
    trackEl.textContent = 'Track A' + (laps.length + 1);
  }

  function makeRow(n, ms, cls, tag) {
    const li = document.createElement('li');
    if (cls) li.className = cls;
    li.innerHTML = `<span class="no">A${n}</span><span class="name">랩 ${n}</span>`
      + (tag ? `<span class="tag">${tag}</span>` : '')
      + `<span class="time-cell">${format(ms)}</span>`;
    return li;
  }

  /* ── 조작 ── */
  function toggle() {
    if (running) {
      elapsed = now();
      running = false;
    } else {
      startTime = performance.now();
      running = true;
      // 재개할 때 진행 중인 비트를 다시 울리지 않도록
      const k = Math.floor(elapsed / BEAT_MS);
      lastBeat = elapsed === 0 ? -1 : k;
      lastMinute = Math.floor(elapsed / 60000);
    }
    if (!running) lamps.forEach(l => l.classList.remove('on'));
    nextBackground();
    updateUI();
    renderLaps();
    updateCrackle();
  }

  function lapOrReset() {
    if (running) {
      const t = now();
      laps.push(t - lapStart);
      lapStart = t;
      ripple(true);
      renderLaps();
      nextBackground();
    } else if (elapsed > 0) {
      elapsed = 0; lapStart = 0; laps = [];
      lastBeat = -1; lastMinute = 0;
      renderLaps();
      updateUI();
      nextBackground();
    }
  }

  function toggleSound() {
    soundOn = !soundOn;
    if (soundOn) { ensureAudio(); actx.resume(); }
    soundBtn.textContent = soundOn ? 'Sound On' : 'Sound Off';
    soundBtn.classList.toggle('on', soundOn);
    soundBtn.setAttribute('aria-pressed', soundOn);
    updateCrackle();
    nextBackground();
  }

  function updateUI() {
    power.classList.toggle('on', running);
    arm.classList.toggle('playing', running);
    startBtn.classList.toggle('running', running);
    startBtn.textContent = running ? 'STOP' : 'START';
    statusEl.textContent = running ? '▶ Play' : elapsed > 0 ? '❚❚ Pause' : '■ Stop';
    lapBtn.textContent = running || elapsed === 0 ? 'LAP' : 'RESET';
    lapBtn.disabled = !running && elapsed === 0;
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', lapOrReset);
  soundBtn.addEventListener('click', toggleSound);

  document.addEventListener('keydown', e => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') { if (running) lapOrReset(); }
    else if (e.key === 'r' || e.key === 'R') { if (!running) lapOrReset(); }
    else if (e.key === 's' || e.key === 'S') toggleSound();
  });

  renderTime(format(0));
  renderLaps();
  requestAnimationFrame(frame);
</script>
</body>
</html>
